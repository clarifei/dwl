name: Bug Report
about: Something in Inca! isn't working correctly
title:
labels:
    - 'Kind/Bug'
body:
    - type: markdown
      attributes:
          value: |
              - Only report bugs that can be reproduced on the main (or wlroots-next) branch without patches.
              - Proprietary graphics drivers, including nvidia, are not supported. Please use an open source equivalent when reporting Inca! issues.
              - Report patch issues to their respective authors.

    - type: input
      id: inca_version
      attributes:
          label: 'Inca! version:'
          placeholder: '`inca -v`'
      validations:
          required: true

    - type: input
      id: wlroots_version
      attributes:
          label: 'wlroots version:'
      validations:
          required: true

    - type: input
      id: distro
      attributes:
          label: What distro (and version) are you using?
      validations:
          required: false

    - type: textarea
      attributes:
          label: Description
          value: |
              The steps you took to reproduce the problem.
      validations:
          required: false

    - type: textarea
      id: debug_log
      attributes:
          label: Debug Log
          value: |
              Run `inca -d 2> ~/inca.log` from a TTY and attach the **full** (do not truncate it) file here, or upload it to a pastebin.
              Please keep the reproduction brief and exit Inca!.
      validations:
          required: false

    - type: textarea
      id: backtrace
      attributes:
          label: Stack Trace
          value: |
              - Only required if Inca! crashes.
              - If lines mentioning Inca! or wlroots have `??`, compile both with debug symbols and try to reproduce.
      validations:
          required: false
